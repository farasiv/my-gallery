<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Personal Gallery</title>
  <script>
    // GitHub Pages serves this file for any path that doesn't exist as a real file.
    // We encode the intended path as a query parameter and redirect to index.html,
    // which will read it and navigate to the correct view.
    const path = window.location.pathname + window.location.search;
    window.location.replace(
      '/my-gallery/?p=' + encodeURIComponent(path)
    );
  </script>
</head>
<body></body>
</html>
